name: 🤖 Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Node.js (kein npm-cache – kein package.json im Root) ─────────
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ── 3. Java 17 ──────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Android SDK ───────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # SDK 34 + Build-Tools 34 (passend zu cordova-android@13 / targetSdk 34)
      - name: Install Android Platform 34 + Build-Tools
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            --channel=0
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      # ── 5. Cordova CLI ───────────────────────────────────────────────────
      - name: Install Cordova CLI
        run: npm install -g cordova@12

      # ── 6. Cordova-Projekt anlegen ───────────────────────────────────────
      - name: Create Cordova Project
        run: |
          cordova create build_tmp com.yourname.vokalpro VokalPro
          cp $GITHUB_WORKSPACE/config.xml build_tmp/config.xml
          cp $GITHUB_WORKSPACE/index.html  build_tmp/www/index.html
          rm -f build_tmp/www/js/index.js build_tmp/www/css/index.css

      # ── 7. Android-Plattform hinzufügen (→ cordova-android@13 aktuell) ──
      - name: Add Android Platform
        working-directory: build_tmp
        run: cordova platform add android --save

      # ── 8. Plugins installieren ──────────────────────────────────────────
      - name: Add Cordova Plugins
        working-directory: build_tmp
        run: |
          cordova plugin add cordova-plugin-camera --save
          cordova plugin add cordova-plugin-statusbar --save
          cordova plugin add cordova-plugin-keyboard --save
          cordova plugin add cordova-plugin-vibration --save

      # ── 9. Native Java-Dateien NACH platform add einkopieren ─────────────
      - name: Copy Native Java Sources
        run: |
          DEST=build_tmp/platforms/android/app/src/main/java/com/yourname/vokalpro
          mkdir -p "$DEST"
          cp -v $GITHUB_WORKSPACE/native/src/main/java/com/yourname/vokalpro/*.java "$DEST/"
          echo "Java-Dateien:"
          ls -la "$DEST/"

      # ── 10. Gradle-Wrapper ausführbar machen ─────────────────────────────
      - name: Fix Gradle permissions
        working-directory: build_tmp
        run: chmod +x platforms/android/gradlew

      # ── 11. Debug-APK bauen ──────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: build_tmp
        run: |
          cordova build android --debug
          echo "Gebaute APKs:"
          find platforms/android -name "*.apk" -type f

      # ── 12. APK als Artifact speichern ───────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VokalPro-debug-${{ github.sha }}
          path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── 13. Zusammenfassung ──────────────────────────────────────────────
      - name: Job Summary
        if: always()
        run: |
          echo "## APK Build" >> $GITHUB_STEP_SUMMARY
          echo "| Feld | Wert |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Typ | Debug (unsigned) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK: Actions Tab -> Workflow-Run -> Artifacts" >> $GITHUB_STEP_SUMMARY
