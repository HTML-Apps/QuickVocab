name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # Damit sind die Warnungen weg
    
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Node.js einrichten
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Cordova installieren
      run: npm install -g cordova

    - name: Build-Prozess
      run: |
        cordova create app com.linuxcore.vokabeltrainer Vokabeltrainer
        cd app
        npm install
        rm config.xml
        cat <<EOF > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.linuxcore.vokabeltrainer" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>VokalPro</name>
              <content src="index.html" />
              <access origin="*" />
              <platform name="android">
                  <allow-intent href="market:*" />
              </platform>
          </widget>
          EOF
        if [ -f "../index.html" ]; then cp ../index.html www/index.html; fi
        
        cordova platform add android
        # Wir erzwingen hier einen Fehler, wenn der Build fehlschlägt
        cordova build android --debug || { echo "BUILD FAILED"; exit 1; }

    - name: Wo ist die APK?
      run: |
        echo "Suche im gesamten Verzeichnis:"
        find . -name "*.apk"
        echo "Inhalt von platforms/android/app/build/outputs/apk/:"
        ls -R platforms/android/app/build/outputs/apk/ || echo "Ordner nicht gefunden"

    - name: Java & Android
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Android SDK
      uses: android-actions/setup-android@v3

    - name: APK hochladen
      uses: actions/upload-artifact@v4
      with:
        name: Vokabeltrainer-APK
        path: |
          **/app-debug.apk
