name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 34 + Build-Tools
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            --channel=0
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install Cordova CLI
        run: npm install -g cordova@12

      # Cordova-Projekt anlegen und Dateien einspielen
      - name: Create Cordova Project
        run: |
          cordova create build_tmp com.yourname.vokalpro VokalPro
          cp $GITHUB_WORKSPACE/config.xml build_tmp/config.xml
          cp $GITHUB_WORKSPACE/index.html  build_tmp/www/index.html
          rm -f build_tmp/www/js/index.js build_tmp/www/css/index.css

      # Android-Plattform hinzufügen (cordova-android@13, targetSdk 34)
      - name: Add Android Platform
        working-directory: build_tmp
        run: cordova platform add android --save

      # Plugins mit exakten Versionen installieren (geprüft auf npm, Mai 2026)
      # WICHTIG: Kein ^ oder ~ – exakte Versionen vermeiden "no matching version" Fehler
      - name: Add Cordova Plugins
        working-directory: build_tmp
        run: |
          cordova plugin add cordova-plugin-camera@8.0.0 --save
          cordova plugin add cordova-plugin-statusbar@4.0.0 --save
          cordova plugin add cordova-plugin-keyboard@1.3.0 --save
          cordova plugin add cordova-plugin-vibration@3.1.1 --save

      # Native Java-Dateien NACH platform add einkopieren
      - name: Copy Native Java Sources
        run: |
          DEST=build_tmp/platforms/android/app/src/main/java/com/yourname/vokalpro
          mkdir -p "$DEST"
          cp -v $GITHUB_WORKSPACE/native/src/main/java/com/yourname/vokalpro/*.java "$DEST/"

      - name: Fix Gradle permissions
        working-directory: build_tmp
        run: chmod +x platforms/android/gradlew

      - name: Build Debug APK
        working-directory: build_tmp
        run: |
          cordova build android --debug
          echo "Gebaute APKs:"
          find platforms/android -name "*.apk" -type f

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VokalPro-debug-${{ github.sha }}
          path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Job Summary
        if: always()
        run: |
          echo "## APK Build" >> $GITHUB_STEP_SUMMARY
          echo "| Feld | Wert |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Typ | Debug (unsigned) |" >> $GITHUB_STEP_SUMMARY
          echo "| APK | Actions -> Artifacts |" >> $GITHUB_STEP_SUMMARY
