name: 🤖 Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Auch manuell über GitHub UI auslösbar

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Node.js (ohne npm-cache, da kein package.json im Root) ───────
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ── 3. Java 17 ──────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Android SDK (inkl. Build-Tools 33 und Platform 33) ───────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform + Build-Tools
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platform-tools" \
            --channel=0
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      # ── 5. Cordova CLI ───────────────────────────────────────────────────
      - name: Install Cordova CLI
        run: npm install -g cordova@12

      # ── 6. Cordova-Projekt anlegen und Dateien einspielen ────────────────
      - name: Create Cordova Project
        run: |
          cordova create build_tmp com.yourname.vokalpro VokalPro
          # config.xml + index.html aus Repo einspielen
          cp $GITHUB_WORKSPACE/config.xml build_tmp/config.xml
          cp $GITHUB_WORKSPACE/index.html build_tmp/www/index.html
          # Standard-Cordova-index.html entfernen
          rm -f build_tmp/www/js/index.js build_tmp/www/css/index.css

      # ── 7. Android-Plattform hinzufügen (aktuelle stabile Version) ───────
      - name: Add Android Platform
        working-directory: build_tmp
        run: cordova platform add android --save

      # ── 8. Plugins installieren ──────────────────────────────────────────
      #       (local-notifications entfernt – wir nutzen nativen ForegroundService)
      - name: Add Cordova Plugins
        working-directory: build_tmp
        run: |
          cordova plugin add cordova-plugin-camera --save
          cordova plugin add cordova-plugin-statusbar --save
          cordova plugin add cordova-plugin-keyboard --save
          cordova plugin add cordova-plugin-vibration --save

      # ── 9. Native Java-Dateien NACH platform add einkopieren ─────────────
      #       (Reihenfolge wichtig: platform add legt Ordnerstruktur erst an)
      - name: Copy Native Java Sources
        run: |
          DEST=build_tmp/platforms/android/app/src/main/java/com/yourname/vokalpro
          mkdir -p "$DEST"
          SRC=$GITHUB_WORKSPACE/native/src/main/java/com/yourname/vokalpro
          cp -v "$SRC"/*.java "$DEST/"
          echo "✅ Java-Dateien kopiert:"
          ls -la "$DEST/"

      # ── 10. Gradle-Wrapper ausführbar machen ─────────────────────────────
      - name: Fix Gradle permissions
        working-directory: build_tmp
        run: chmod +x platforms/android/gradlew

      # ── 11. Debug-APK bauen ──────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: build_tmp
        run: |
          cordova build android --debug
          echo "✅ APK gebaut:"
          find platforms/android -name "*.apk" -type f

      # ── 12. APK als GitHub Artifact speichern ────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VokalPro-debug-${{ github.sha }}
          path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── 13. Zusammenfassung ──────────────────────────────────────────────
      - name: Job Summary
        if: always()
        run: |
          echo "## 🤖 APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Feld | Wert |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Typ | Debug (unsigned) |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | VokalPro-debug-${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 APK → **Actions Tab → Workflow-Run → Artifacts**" >> $GITHUB_STEP_SUMMARY
