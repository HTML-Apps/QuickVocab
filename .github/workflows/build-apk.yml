name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Schritt 1: Wir laden Java 17, damit die Android-Tools zufrieden sind
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Schritt 2: Android SDK Setup (läuft jetzt mit Java 17)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Schritt 3: Install Cordova CLI
      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Dependencies
        run: npm install

      - name: Prepare Cordova Project
        run: cordova prepare android

      # Schritt 4: Build APK mit Java 11 erzwingen
      # Wir überschreiben JAVA_HOME nur für diesen einen Schritt!
      - name: Build APK
        run: |
          # Wir switchen das JAVA_HOME kurz vor dem Build auf Version 11
          export JAVA_HOME=$JAVA_HOME_11_X64
          cd platforms/android
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          # Dies stellt sicher, dass Java 11 verfügbar ist
          JAVA_HOME_11_X64: /usr/lib/jvm/temurin-11-jdk-amd64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickVocab-APK
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk