name: Build Android APK

on:
  workflow_dispatch: # Manueller Start per Button

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Zwingt GitHub Actions auf das zukunftssichere Node 24 (behebt die Warnungen)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Node.js einrichten
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Cordova installieren
      run: npm install -g cordova

    - name: Cordova Projekt aufbauen
      run: |
        # 1. Projekt erstellen
        cordova create app com.linuxcore.vokabeltrainer Vokabeltrainer
        cd app
        
        # 2. Alle Abhängigkeiten installieren (wichtig!)
        npm install
        
        # 3. Alte Dateien säubern
        rm -rf www/*
        rm config.xml
        
        # 4. Saubere config.xml schreiben
        cat <<EOF > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.linuxcore.vokabeltrainer" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>VokalPro</name>
              <content src="index.html" />
              <access origin="*" />
              <platform name="android">
                  <allow-intent href="market:*" />
              </platform>
          </widget>
          EOF
                  
        # 5. Deine App-Datei kopieren
        if [ -f "../index.html" ]; then
          cp ../index.html www/index.html
        fi
        
        # 6. Plattform hinzufügen
        cordova platform add android

    - name: Java einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Android SDK bereitstellen
      uses: android-actions/setup-android@v3

    - name: APK kompilieren
      run: |
        cd app
        cordova build android --debug

    - name: APK als Download bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: Vokabeltrainer-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
