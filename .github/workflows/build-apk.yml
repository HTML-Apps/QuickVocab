name: Build Android APK

on:
  workflow_dispatch: # Manueller Start per Button

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Node.js einrichten
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Cordova installieren
      run: npm install -g cordova

    - name: Build-Prozess ausführen
      run: |
        # 1. Projekt erstellen
        cordova create app com.linuxcore.vokabeltrainer Vokabeltrainer
        cd app
        
        # 2. Abhängigkeiten installieren
        npm install
        
        # 3. Config.xml generieren
        rm config.xml
        cat <<EOF > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.linuxcore.vokabeltrainer" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>VokalPro</name>
              <content src="index.html" />
              <access origin="*" />
              <platform name="android">
                  <allow-intent href="market:*" />
              </platform>
          </widget>
          EOF
        
        # 4. App-Content kopieren
        if [ -f "../index.html" ]; then
          cp ../index.html www/index.html
        fi
        
        # 5. Plattform hinzufügen und Build starten
        cordova platform add android
        cordova build android --debug

    - name: Suche nach der APK (Detektiv-Modus)
      run: |
        echo "Suche im app-Verzeichnis nach APK-Dateien:"
        find . -name "*.apk"

    - name: Java einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Android SDK bereitstellen
      uses: android-actions/setup-android@v3

    - name: APK als Download bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: Vokabeltrainer-APK
        path: |
          **/*.apk
