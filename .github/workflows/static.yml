name: 🌐 Deploy GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare www/ folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -d "res" ] && cp -r res www/res || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Pages Summary
        run: |
          echo "## 🌐 GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "App-URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "> Kamera funktioniert nur über HTTPS – GitHub Pages liefert HTTPS ✓" >> $GITHUB_STEP_SUMMARY
