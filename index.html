<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickVocab - One UI 8 Compact Controller</title>
    <style>
        :root {
            --oneui-bg: #000000;
            --oneui-panel-bg: rgba(28, 28, 30, 0.75); 
            --oneui-card-bg: rgba(36, 36, 38, 0.95);  
            --oneui-inner-bg: rgba(54, 54, 56, 0.4);   
            --oneui-primary: #7C4DFF;                  
            --oneui-text-title: #FFFFFF;
            --oneui-text-muted: #8E8E93;
            
            --oneui-radius-large: 28px;
            --oneui-radius-medium: 20px;
            --oneui-radius-small: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Samsung One", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: var(--oneui-text-title);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-frame {
            width: 390px;
            height: 844px;
            border: 10px solid #1c1c1e;
            border-radius: 48px;
            position: relative;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=390&auto=format&fit=crop') center/cover;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        .punch-hole {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background-color: #000;
            border-radius: 50%;
            z-index: 1000;
        }

        .status-bar-native {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 44px;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 90;
            color: white;
            cursor: pointer;
        }

        .oneui-drawer {
            position: absolute;
            top: -800px; 
            left: 0;
            width: 100%;
            height: 816px;
            background: var(--oneui-panel-bg);
            backdrop-filter: blur(35px) saturate(160%);
            -webkit-backdrop-filter: blur(35px) saturate(160%);
            border-bottom-left-radius: var(--oneui-radius-large);
            border-bottom-right-radius: var(--oneui-radius-large);
            transition: transform 0.35s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 500;
            display: flex;
            flex-direction: column;
        }

        .drawer-header {
            padding: 50px 32px 10px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-header .time {
            font-size: 1.6rem;
            font-weight: 400;
        }

        .notifications-list {
            padding: 8px 16px;
            flex-grow: 1;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--oneui-text-muted);
            padding: 0 8px 8px 8px;
            text-transform: uppercase;
        }

        .oneui-notification-card {
            background: var(--oneui-card-bg);
            border-radius: var(--oneui-radius-medium);
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .app-meta {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .app-icon-wrapper {
            width: 24px;
            height: 24px;
            background: var(--oneui-primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.75rem;
            margin-right: 10px;
        }

        .app-name {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .card-content {
            background: var(--oneui-inner-bg);
            border-radius: var(--oneui-radius-medium);
            padding: 24px 16px;
            text-align: left; 
            margin-bottom: 16px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .vocab-word {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--oneui-text-title);
            line-height: 1.3;
        }

        .vocab-translation {
            font-size: 1.15rem;
            font-weight: 400;
            color: var(--oneui-text-muted);
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .vocab-translation.visible {
            opacity: 1;
            color: #FFD60A; 
        }

        .control-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .control-group-left {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .control-group-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: var(--oneui-radius-small);
            color: var(--oneui-text-title);
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.15s, transform 0.1s;
        }

        .icon-btn:active {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(0.93);
        }

        .icon-btn.active {
            background: rgba(124, 77, 255, 0.25);
            border: 1px solid var(--oneui-primary);
            color: #B388FF;
        }

        .icon-btn.favorited {
            background: rgba(255, 69, 58, 0.2);
            color: #FF453A;
        }

        .index-indicator {
            font-size: 0.95rem;
            color: var(--oneui-text-muted);
            min-width: 20px;
            text-align: center;
            font-weight: 500;
            margin: 0 2px;
        }

        .drawer-handle {
            height: 32px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .handle-bar {
            width: 48px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }

        .bottom-nav-hint {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
        }
    </style>
    <!-- Cordova Core Script-Injektion -->
    <script src="cordova.js"></script>
</head>
<body>

<div class="phone-frame">
    <div class="punch-hole"></div>
    
    <div class="status-bar-native" onclick="toggleDrawer()">
        <div>12:30</div>
        <div>📶 🔋 100%</div>
    </div>

    <div class="bottom-nav-hint">
        Klicke ganz oben, um das Quick Panel zu öffnen.
    </div>

    <div class="oneui-drawer" id="oneuiDrawer">
        <div class="drawer-header">
            <div class="time">12:30</div>
            <div style="font-size: 0.9rem; color: var(--oneui-text-muted);">QuickVocab Controller</div>
        </div>

        <div class="notifications-list">
            <div class="section-title">Laufendes Training</div>
            
            <div class="oneui-notification-card">
                <div class="app-meta">
                    <div class="app-icon-wrapper">Q</div>
                    <div class="app-name">QuickVocab</div>
                </div>
                
                <div class="card-content">
                    <div class="vocab-word" id="word-display">die Schwierigkeit, Schwierigkeiten</div>
                    <div class="vocab-translation" id="translation-display">las dificultades</div>
                </div>
                
                <div class="control-bar">
                    <div class="control-group-left">
                        <button class="icon-btn" id="btn-random" onclick="setMode('random')" title="Zufallsvokabel">🎲</button>
                        <button class="icon-btn active" id="btn-chrono" onclick="setMode('chrono')" title="Chronologische Abfrage">📋</button>
                        <button class="icon-btn" id="btn-owl" onclick="toggleFavorite()" title="Als schwierig speichern">🦉</button>
                        <div class="index-indicator" id="index-display">1</div>
                    </div>
                    
                    <div class="control-group-right">
                        <button class="icon-btn" onclick="navigate(-1)" title="Zurück">＜</button>
                        <button class="icon-btn" id="btn-solve" onclick="toggleSolve()" title="Lösung anzeigen">L</button>
                        <button class="icon-btn" onclick="navigate(1)" title="Weiter">＞</button>
                    </div>
                </div>

            </div>
        </div>

        <div class="drawer-handle" onclick="toggleDrawer()">
            <div class="handle-bar"></div>
        </div>
    </div>
</div>

<script>
    const vocabulary = [
        { foreign: "die Schwierigkeit, Schwierigkeiten", translation: "las dificultades" },
        { foreign: "der Wortschatz, Wortschätze", translation: "el vocabulario" },
        { foreign: "das Alltagsleben", translation: "la vida cotidiana" },
        { foreign: "die Aussprache", translation: "la pronunciación" },
        { foreign: "regelmäßig üben", translation: "practicar regularmente" }
    ];

    let currentIndex = 0;
    let mode = 'chrono'; 
    let drawerOpen = false;
    let favorites = new Set();
    let isSolved = false;

    const drawer = document.getElementById('oneuiDrawer');
    const wordDisplay = document.getElementById('word-display');
    const translationDisplay = document.getElementById('translation-display');
    const indexDisplay = document.getElementById('index-display');
    
    const btnRandom = document.getElementById('btn-random');
    const btnChrono = document.getElementById('btn-chrono');
    const btnOwl = document.getElementById('btn-owl');
    const btnSolve = document.getElementById('btn-solve');

    // Cordova Brücke aktivieren sobald bereit
    document.addEventListener('deviceready', () => {
        updateAndroidSystemNotification();
        
        // Fängt Klicks aus dem echten Android Notification-System ab
        if (window.cordova && cordova.plugins && cordova.plugins.notification) {
            cordova.plugins.notification.local.on('action', (notification, action) => {
                if (action.id === 'next') navigate(1);
                else if (action.id === 'prev') navigate(-1);
                else if (action.id === 'solve') toggleSolve();
            });
        }
    }, false);

    function toggleDrawer() {
        drawer.style.transform = drawerOpen ? 'translateY(0px)' : 'translateY(800px)';
        drawerOpen = !drawerOpen;
    }

    function setMode(newMode) {
        mode = newMode;
        if (mode === 'chrono') {
            btnChrono.classList.add('active');
            btnRandom.classList.remove('active');
        } else {
            btnRandom.classList.add('active');
            btnChrono.classList.remove('active');
            triggerRandom();
        }
    }

    function triggerRandom() {
        let nextIndex;
        do {
            nextIndex = Math.floor(Math.random() * vocabulary.length);
        } while (nextIndex === currentIndex && vocabulary.length > 1);
        
        currentIndex = nextIndex;
        updateUI();
    }

    function navigate(direction) {
        if (mode === 'random' && direction === 1) {
            triggerRandom();
            return;
        }
        
        currentIndex += direction;
        if (currentIndex >= vocabulary.length) currentIndex = 0;
        if (currentIndex < 0) currentIndex = vocabulary.length - 1;
        
        updateUI();
    }

    function toggleSolve() {
        isSolved = !isSolved;
        if (isSolved) {
            translationDisplay.classList.add('visible');
            btnSolve.classList.add('active');
        } else {
            translationDisplay.classList.remove('visible');
            btnSolve.classList.remove('active');
        }
        updateAndroidSystemNotification();
    }

    function toggleFavorite() {
        if (favorites.has(currentIndex)) {
            favorites.delete(currentIndex);
            btnOwl.classList.remove('favorited');
        } else {
            favorites.add(currentIndex);
            btnOwl.classList.add('favorited');
        }
    }

    // Aktualisiert die native Android System-Notification-Leiste
    function updateAndroidSystemNotification() {
        if (window.cordova && cordova.plugins && cordova.plugins.notification) {
            const current = vocabulary[currentIndex];
            const textContent = isSolved ? `${current.foreign} = ${current.translation}` : current.foreign;

            cordova.plugins.notification.local.schedule({
                id: 1,
                title: 'QuickVocab Active Training',
                text: textContent,
                sticky: true,
                foreground: true,
                lockscreen: true,
                actions: [
                    { id: 'prev', title: '＜' },
                    { id: 'solve', title: isSolved ? 'Verbergen' : 'Lösung' },
                    { id: 'next', title: '＞' }
                ]
            });
        }
    }

    function updateUI() {
        wordDisplay.innerText = vocabulary[currentIndex].foreign;
        translationDisplay.innerText = vocabulary[currentIndex].translation;
        indexDisplay.innerText = currentIndex + 1;
        
        translationDisplay.classList.remove('visible');
        btnSolve.classList.remove('active');
        isSolved = false;
        
        if (favorites.has(currentIndex)) {
            btnOwl.classList.add('favorited');
        } else {
            btnOwl.classList.remove('favorited');
        }

        updateAndroidSystemNotification();
    }

    updateUI();
</script>

</body>
</html>
